<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #f5f7fb;
      }
      header {
        padding: 20px;
        background: #111;
        color: white;
      }
      main {
        padding: 20px;
        max-width: 1100px;
        margin: auto;
      }
      input,
      button {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }
      button {
        cursor: pointer;
      }
      .btn-delete {
        background: #ff4d4d;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        margin-top: 10px;
        font-size: 13px;
      }
      .btn-delete:hover {
        background: #cc0000;
      }
      #map {
        height: 400px;
        border-radius: 14px;
        margin: 20px 0;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        padding: 15px;
        margin: 12px 0;
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 15px;
        position: relative;
      }
      .card img {
        width: 180px;
        height: 140px;
        object-fit: cover;
        border-radius: 10px;
      }
      @media (max-width: 600px) {
        .card {
          grid-template-columns: 1fr;
        }
        .card img {
          width: 100%;
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <header><h2>Dashboard Foto & Lokasi</h2></header>
    <main>
      <p>Masukkan admin token yang kamu set di server.</p>
      <input id="token" type="password" placeholder="ADMIN_TOKEN" />
      <button id="load">Tampilkan Data</button>
      <div id="map"></div>
      <div id="items"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      let map = L.map("map").setView([0, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      document.getElementById("load").onclick = async () => {
        const token = document.getElementById("token").value.trim();
        if (!token) return;

        const res = await fetch("/api/submissions", {
          headers: { "x-admin-token": token },
        });
        if (!res.ok) return alert("Token salah atau server menolak akses.");

        const rows = await res.json();
        const items = document.getElementById("items");
        items.innerHTML = "";

        if (!rows.length) {
          items.textContent = "Belum ada data.";
          return;
        }

        map.eachLayer((layer) => {
          if (layer instanceof L.Marker) map.removeLayer(layer);
        });

        const bounds = [];

        rows.forEach((row) => {
          const p = [row.latitude, row.longitude];
          bounds.push(p);

          L.marker(p)
            .addTo(map)
            .bindPopup(`ID #${row.id}<br>${row.latitude}, ${row.longitude}`);

          const div = document.createElement("div");
          div.className = "card";

          const img = document.createElement("img");
          img.src = `/api/submissions/${row.id}/photo?token=${encodeURIComponent(token)}`;

          const info = document.createElement("div");
          info.innerHTML = `
            <b>ID #${row.id}</b><br>
            Latitude: ${row.latitude}<br>
            Longitude: ${row.longitude}<br>
            Akurasi: ${row.accuracy ?? "-"} meter<br>
            Waktu: ${new Date(row.captured_at).toLocaleString()}<br>
          `;

          // Tombol Hapus
          const btnDelete = document.createElement("button");
          btnDelete.className = "btn-delete";
          btnDelete.textContent = "Hapus Data";
          btnDelete.onclick = async () => {
            const konfirmasi = confirm(
              `Yakin ingin menghapus data ID #${row.id}?`,
            );
            if (!konfirmasi) return;

            const delRes = await fetch(`/api/submissions/${row.id}`, {
              method: "DELETE",
              headers: { "x-admin-token": token },
            });

            if (delRes.ok) {
              // Jika berhasil dihapus, muat ulang datanya otomatis
              document.getElementById("load").click();
            } else {
              alert("Gagal menghapus data.");
            }
          };

          info.appendChild(btnDelete);
          div.append(img, info);
          items.appendChild(div);
        });

        map.fitBounds(bounds, { padding: [30, 30] });
      };
    </script>
  </body>
</html>
